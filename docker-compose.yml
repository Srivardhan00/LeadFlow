version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: leadflow-db
    environment:
      POSTGRES_DB: assignment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assignment"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
